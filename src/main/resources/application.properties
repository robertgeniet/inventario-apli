# Puerto del servicio web
server.port=8080

# Base de datos H2 en memoria (facilita pruebas sin instalar motor externo)
spring.datasource.url=jdbc:h2:mem:inventariodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para verificar los datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
